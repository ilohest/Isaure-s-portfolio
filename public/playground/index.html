<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes mondes</title>
<meta name="description" content="Une entrée vers mes petits mondes : un ciel quadrillé, des objets flottants, et derrière chacun une porte.">
<style>
:root{
  color-scheme:light;
  --ink:#1f2a3a;
  --sheet:#fbf7ec;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3f6b3f}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}


.stage{position:fixed;inset:0;overflow:hidden}
.obj{
  position:absolute;width:calc(var(--s)*var(--k)*1px);
  animation:bob var(--bd,7s) ease-in-out var(--bl,0s) infinite alternate, in .7s cubic-bezier(.3,1.5,.5,1) backwards;
  animation-delay:var(--bl,0s), calc(var(--n)*.06s);
}
.obj.drift{animation:drift var(--dd,90s) linear var(--dl,0s) infinite, in .7s ease backwards;animation-delay:var(--dl,0s),0s;left:0}
.obj .in{display:block;transform-origin:50% 60%;transition:transform .35s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(2px 4px 0 rgba(20,40,70,.18))}
.obj svg{display:block;width:100%;height:auto;overflow:visible}
.obj:hover .in,.obj:focus-visible .in{transform:scale(1.14) rotate(-5deg)}
button.obj{padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit}
button.obj:focus-visible{outline:2px dashed #fff;outline-offset:8px;border-radius:8px}
/* le monde ouvert : un petit anneau qui respire autour de l'objet */
.home{position:absolute;z-index:4;display:grid;place-items:center;padding:0;border:0;cursor:pointer;background:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1);animation:in .7s cubic-bezier(.3,1.5,.5,1) backwards}
.home img{width:46%;height:auto;display:block;pointer-events:none;filter:drop-shadow(2px 4px 0 rgba(20,40,70,.18))}
.home:hover,.home:focus-visible{transform:scale(1.06) rotate(-2deg);outline:none}
.home:focus-visible{outline:2px dashed #fff;outline-offset:-6px}
.portal::after{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border:1.6px dashed #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.8;animation:breathe 3.2s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.35}50%{transform:translate(-50%,-50%) scale(1.06);opacity:.9}}
@keyframes bob{from{translate:0 -4px;rotate:-1.5deg}to{translate:0 5px;rotate:1.5deg}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(125vw)}}
@keyframes in{from{opacity:0;scale:.4}}


.veil{position:fixed;inset:0;z-index:100;pointer-events:none;clip-path:circle(0 at 50% 50%);background:#f2a7c3;transition:clip-path .75s cubic-bezier(.6,0,.3,1)}

@media (prefers-reduced-motion: reduce){
  .obj,.obj.drift,.portal::after{animation:none}
  .obj .in,.veil{transition:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="stage" id="stage"></main>
<div class="veil" id="veil" aria-hidden="true"></div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };

/* ---------- les petits objets (papier découpé, dessinés en SVG) ---------- */
const RUNGS = Array.from({length:10}, (_,i) => `<rect x="4" y="${6+i*11}" width="22" height="2.4"/>`).join('');
const SVG = {
  cloud:   '<svg viewBox="0 0 100 50"><g fill="#fff"><ellipse cx="32" cy="33" rx="26" ry="12"/><ellipse cx="55" cy="25" rx="22" ry="16"/><ellipse cx="76" cy="34" rx="20" ry="10"/></g></svg>',
  bottle:  '<svg viewBox="0 0 100 22"><path d="M1 9 L36 8 Q42 3 54 3 L96 3 Q99 3 99 6 L99 16 Q99 19 96 19 L54 19 Q42 19 36 14 L1 13Z" fill="#4b2a20"/></svg>',
  window:  '<svg viewBox="0 0 40 90"><rect x="1" y="1" width="38" height="88" fill="#efe3cf" stroke="#c9b99b"/><rect x="6" y="8" width="28" height="74" fill="#2b2420"/><polygon points="6,8 19,8 15,45 11,82 6,82" fill="#f6efe2"/><polygon points="34,8 21,8 25,45 29,82 34,82" fill="#f6efe2"/></svg>',
  door:    '<svg viewBox="0 0 60 90"><path fill="#f3ecde" fill-rule="evenodd" d="M4 16 L30 2 L56 16 V88 H4Z M12 24 H48 V88 H12Z"/></svg>',
  ladder:  `<svg viewBox="0 0 30 110"><g fill="#1f1f24"><rect x="3" y="0" width="3" height="110"/><rect x="24" y="0" width="3" height="110"/>${RUNGS}</g></svg>`,
  stairs:  '<svg viewBox="0 0 60 60"><polygon points="0,0 0,60 60,60 60,48 48,48 48,36 36,36 36,24 24,24 24,12 12,12 12,0" fill="#fff"/></svg>',
  triBlue: '<svg viewBox="0 0 50 40"><polygon points="25,0 50,40 0,40" fill="#5b7fa8"/></svg>',
  triRed:  '<svg viewBox="0 0 40 50"><polygon points="0,0 40,25 0,50" fill="#c4604f"/></svg>',
  squig:   '<svg viewBox="0 0 14 50"><path d="M7 2 q-6 5 0 10 t0 10 t0 10 t0 10" fill="none" stroke="#c4604f" stroke-width="3" stroke-linecap="round"/></svg>',
  arc:     '<svg viewBox="0 0 30 40"><path d="M22 3 A16 17 0 1 0 22 37" fill="none" stroke="#c4604f" stroke-width="3" stroke-linecap="round"/></svg>',
  rock:    '<svg viewBox="0 0 50 50"><polygon points="10,8 26,2 40,10 48,26 38,44 20,48 6,36 2,20" fill="#1d1c20"/><polygon points="14,12 26,7 30,18 18,24" fill="#3a3940"/></svg>',
  planet:  '<svg viewBox="0 0 100 100"><g fill="none" stroke="#5b7fd1" stroke-width="1.6"><circle cx="50" cy="50" r="48"/><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="32"/></g><circle cx="50" cy="50" r="24" fill="#f2a7c3" stroke="#33302b" stroke-opacity=".4"/><circle cx="51" cy="51" r="10" fill="#e2553f"/></svg>'
};

/* fx / fy = position voulue dans la grille (0 à 1) ; k = largeur en cases ; world = lien du monde ; soon = pas encore ouvert */
const OBJECTS = [
  { svg:'planet', k:.34, fx:.60, fy:.60, world:'/playground/planetes/index.html', label:'Les planètes', veil:'#f2a7c3' },
  { svg:'window', k:.2,  fx:.50, fy:.28, world:'/playground/releve/index.html', label:'Le relevé', veil:'#2b44b5' },
  { svg:'door',   k:.28, fx:.27, fy:.86, world:'/playground/ingredients/index.html', label:'Les ingrédients du succès', veil:'#f08a3c' },
  { svg:'ladder', k:.11, fx:.90, fy:.64, world:'/playground/herbier/index.html', label:"L'herbier", veil:'#474a21' },
  { svg:'cloud',  k:.5,  fx:.10, fy:.30 },
  { svg:'cloud',  k:.45, fx:.70, fy:.88 },
  { svg:'arc',    k:.1,  fx:.62, fy:.08 },
  { svg:'bottle', k:.38, fx:.34, fy:.20 },
  { svg:'stairs', k:.22, fx:.88, fy:.20 },
  { svg:'triBlue',k:.2,  fx:.80, fy:.42 },
  { svg:'squig',  k:.06, fx:.20, fy:.42 },
  { svg:'rock',   k:.17, fx:.10, fy:.60, world:'/playground/collection/index.html', label:'La collection', veil:'#2a2a2e' },
  { svg:'triRed', k:.14, fx:.36, fy:.62 },
  { svg:'squig',  k:.06, fx:.56, fy:.99, flat:true }
];

const stage = $('stage'), bg = $('bg'), g = bg.getContext('2d');
let W, H, DPR, S, cols, rows, horizon;

/* ---------- ciel, grille, paysage ---------- */
function paintBackground(){
  bg.width = W*DPR; bg.height = H*DPR; g.setTransform(DPR,0,0,DPR,0,0);
  const r = mulberry(5);

  const sky = g.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#8fb3d0'); sky.addColorStop(1,'#cfe3ef');
  g.fillStyle = sky; g.fillRect(0,0,W,H);

  // paysage vu d'en haut : un patchwork de champs, chacun un peu différent
  const greens = ['#3f6b3f','#4a7a46','#56864f','#35603a','#628f58','#2f5736','#6e9a5e'];
  const gc = Math.max(5, Math.round(W/150)), gr = 3;
  const hgt = H - horizon;
  const jit = [];
  for (let j=0;j<=gr;j++){ jit[j] = []; for (let i=0;i<=gc;i++){
    jit[j][i] = { x:i*W/gc + (i&&i<gc ? (r()-.5)*W/gc*.7 : 0), y:horizon + j*hgt/gr + (j&&j<gr ? (r()-.5)*hgt/gr*.7 : 0) };
  } }
  jit[0].forEach(p => p.y = horizon); jit[gr].forEach(p => p.y = H);
  for (let j=0;j<gr;j++) for (let i=0;i<gc;i++){
    const a = jit[j][i], b = jit[j][i+1], c = jit[j+1][i+1], d = jit[j+1][i];
    g.fillStyle = greens[Math.floor(r()*greens.length)];
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(c.x,c.y); g.lineTo(d.x,d.y); g.closePath(); g.fill();
    // sillons
    g.save(); g.clip();
    g.strokeStyle = r() > .5 ? 'rgba(20,50,25,.22)' : 'rgba(210,235,170,.16)'; g.lineWidth = 1;
    const ang = r()*Math.PI, step = 4 + r()*3, cx = (a.x+c.x)/2, cy = (a.y+c.y)/2, L = 260;
    for (let o=-L;o<L;o+=step){
      g.beginPath();
      g.moveTo(cx + Math.cos(ang)*-L - Math.sin(ang)*o, cy + Math.sin(ang)*-L + Math.cos(ang)*o);
      g.lineTo(cx + Math.cos(ang)*L - Math.sin(ang)*o, cy + Math.sin(ang)*L + Math.cos(ang)*o);
      g.stroke();
    }
    g.restore();
  }
  // un chemin de terre clair
  g.strokeStyle = 'rgba(224,210,160,.65)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, horizon + hgt*.55);
  g.bezierCurveTo(W*.25, horizon + hgt*.35, W*.45, horizon + hgt*.8, W*.7, horizon + hgt*.5);
  g.bezierCurveTo(W*.85, horizon + hgt*.35, W*.95, horizon + hgt*.4, W, horizon + hgt*.3);
  g.stroke();

  // grain de papier partout
  const n = Math.min(40000, W*H/45);
  for (let i=0;i<n;i++){
    g.fillStyle = r() > .5 ? `rgba(255,255,255,${.04+r()*.08})` : `rgba(40,50,70,${.03+r()*.06})`;
    g.fillRect(r()*W, r()*H, r()*1.6+.4, r()*1.6+.4);
  }

  // la grille : traits blancs, petits points aux croisements
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.5; g.fillStyle = '#fff';
  g.beginPath();
  for (let i=1;i<cols;i++){ g.moveTo(i*S,0); g.lineTo(i*S,horizon); }
  for (let j=1;j<=rows;j++){ g.moveTo(0,j*S); g.lineTo(W,j*S); }
  g.stroke();
  for (let j=1;j<=rows;j++) for (let i=1;i<cols;i++){ g.beginPath(); g.arc(i*S, j*S, 3.2, 0, 6.3); g.fill(); }

  // vignette douce
  const v = g.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(20,40,70,0)'); v.addColorStop(1,'rgba(20,40,70,.18)');
  g.fillStyle = v; g.fillRect(0,0,W,H);
}

/* ---------- les objets dans les cases ---------- */
function layout(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  // on cherche le nombre de colonnes qui laisse un sol d'environ 20 % de la hauteur, collé au bas de l'écran
  const want = W < 700 ? 3 : 5, best = { score:1e9 };
  for (let c=2;c<=14;c++){
    const sz = W/c; if (sz < 105 || sz > 300) continue;
    const rr = Math.max(3, Math.floor(H*.84/sz)), ratio = rr*sz/H;
    const score = Math.abs(ratio - .8)*1.5 + Math.abs(c - want)*.12;
    if (score < best.score){ best.score = score; best.c = c; best.r = rr; }
  }
  cols = best.c || want; S = W/cols; rows = best.r || 3;
  horizon = Math.min(rows*S, H*.9);
  paintBackground();

  stage.innerHTML = ''; stage.style.setProperty('--s', S);
  const used = new Set(['0,0']), r = mulberry(21);
  OBJECTS.forEach((o,n) => {
    const el = document.createElement(o.world ? 'button' : 'div'); if (o.world) el.type = 'button';
    el.className = 'obj' + (o.world ? ' portal' : '') + (o.cloud ? ' drift' : '');
    el.style.setProperty('--k', o.k); el.style.setProperty('--n', n);
    el.style.setProperty('--bd', (5.5 + r()*4).toFixed(1) + 's'); el.style.setProperty('--bl', (-r()*6).toFixed(1) + 's');
    el.innerHTML = `<span class="in">${SVG[o.svg]}</span>`;
    if (o.world) el.setAttribute('aria-label', `Entrer dans : ${o.label}`);
    if (o.flat) el.querySelector('.in').style.transform = 'rotate(90deg)';

    // case voulue, ou la première case libre juste après
    let c = clamp(Math.floor(o.fx*cols), 0, cols-1), ro = clamp(Math.floor(o.fy*rows), 0, rows-1);
    while (used.has(c+','+ro)){ c = (c+1) % cols; if (!c) ro = (ro+1) % rows; }
    used.add(c+','+ro);
    const w = S*o.k, jx = (r()-.5)*S*.3, jy = (r()-.5)*S*.3;
    if (o.cloud){
      el.style.top = (ro*S + S*.3 + jy) + 'px';
      el.style.setProperty('--dd', (80 + r()*50).toFixed(0) + 's'); el.style.setProperty('--dl', (-r()*80).toFixed(0) + 's');
    } else {
      const h = el.querySelector('svg').viewBox.baseVal.height / el.querySelector('svg').viewBox.baseVal.width * w;
      el.style.left = (c*S + S/2 - w/2 + jx) + 'px';
      el.style.top  = (ro*S + S/2 - h/2 + jy) + 'px';
    }
    if (o.world) el.addEventListener('click', () => enter(el, o));
    stage.appendChild(el);
  });
  addHome();
}

/* ---------- la case du portfolio : en haut à gauche, pour revenir ---------- */
function addHome(){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'home'; b.setAttribute('aria-label', 'Retour au portfolio');
  const m = Math.max(4, S*.03);
  b.style.cssText = `left:${m}px;top:${m}px;width:${S-2*m}px;height:${S-2*m}px`;
  b.innerHTML = '<img src="/favicon.svg" alt="">';
  b.addEventListener('click', () => enter(b, { world:'/', veil:'#f4efe4' }));
  stage.appendChild(b);
}

/* ---------- entrer dans un monde : un rond de couleur grandit depuis l'objet ---------- */
const veil = $('veil');
function enter(el, o){
  const b = el.getBoundingClientRect();
  veil.style.background = o.veil;
  veil.style.clipPath = `circle(0 at ${b.left + b.width/2}px ${b.top + b.height/2}px)`;
  void veil.offsetWidth;
  veil.style.clipPath = `circle(150vmax at ${b.left + b.width/2}px ${b.top + b.height/2}px)`;
  setTimeout(() => { location.href = o.world; }, 760);
}
addEventListener('pageshow', e => { if (e.persisted) veil.style.clipPath = 'circle(0 at 50% 50%)'; });

let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 150); });
layout();
})();
</script>
</body>
</html>
