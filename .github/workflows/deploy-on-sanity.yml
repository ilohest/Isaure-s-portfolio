name: Déployer le site (publication Sanity)

# Déclenché par un webhook Sanity (voir docs/deploiement-auto-sanity.md) ou à la main
# depuis l'onglet Actions de GitHub. Même résultat que scripts/deploy-vps.sh :
# build Astro, rsync de dist/ vers le VPS, reload d'Apache.
on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Une seule mise en ligne à la fois ; si plusieurs publications s'enchaînent,
# la suivante attend (et seule la plus récente est gardée en file).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Laisse au CDN de Sanity le temps de refléter la publication.
      - name: Attendre le CDN Sanity
        if: github.event_name == 'repository_dispatch'
        run: sleep 20

      - name: Build
        run: npm run build

      - name: Droits de lecture
        run: chmod -R a+rX dist

      - name: Clé SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Rsync et reload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          REMOTE_DIST="${DEPLOY_PATH%/}/dist"
          # même sauvegarde unique que scripts/deploy-vps.sh
          $SSH "$REMOTE" "sudo mkdir -p \"$REMOTE_DIST\" && sudo rm -rf \"$REMOTE_DIST.backup\" && sudo cp -a \"$REMOTE_DIST\" \"$REMOTE_DIST.backup\""
          rsync -avzL --delete -e "$SSH" dist/ "$REMOTE:$REMOTE_DIST/"
          $SSH "$REMOTE" "sudo systemctl reload apache2"
